{% extends "base.html" %}

{% block title %}
Withdraw Money
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Withdraw Money
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">
                    Amount
                </label>

                <input
                    type="number"
                    name="amount"
                    class="form-control"
                    placeholder="Enter amount"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-danger w-100">
                Withdraw
            </button>

        </form>

    </div>

</div>

{% endblock %}
