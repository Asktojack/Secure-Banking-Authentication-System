<!DOCTYPE html>
<html>
<head>
    <title>Select Authentication Pattern</title>
</head>

<body>

<h1>Select Your Authentication Pattern</h1>

<p>
    Select the authentication methods in the same order
    that you selected during registration.
</p>

<form method="POST">

    <label>Authentication Step 1:</label>
    <select name="step1" required>
        <option value="">Select Step 1</option>
        <option value="Email">Email OTP</option>
        <option value="SMS">SMS OTP</option>
        <option value="Authenticator">Authenticator</option>
    </select>

    <br><br>

    <label>Authentication Step 2:</label>
    <select name="step2" required>
        <option value="">Select Step 2</option>
        <option value="Email">Email OTP</option>
        <option value="SMS">SMS OTP</option>
        <option value="Authenticator">Authenticator</option>
    </select>

    <br><br>

    <label>Authentication Step 3:</label>
    <select name="step3" required>
        <option value="">Select Step 3</option>
        <option value="Email">Email OTP</option>
        <option value="SMS">SMS OTP</option>
        <option value="Authenticator">Authenticator</option>
    </select>

    <br><br>

    <button type="submit">
        Continue
    </button>

</form>

</body>
</html>
