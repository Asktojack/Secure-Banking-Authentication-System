<!DOCTYPE html>
<html>

<head>
    <title>Add Beneficiary</title>
</head>

<body>

<h2>Add Beneficiary</h2>

<form method="POST">

    Name
    <br>
    <input type="text" name="name" required>

    <br><br>

    Account Number
    <br>
    <input type="text" name="account" required>

    <br><br>

    Bank Name
    <br>
    <input type="text" name="bank" required>

    <br><br>

    IFSC Code
    <br>
    <input type="text" name="ifsc" required>

    <br><br>

    <button type="submit">
        Save Beneficiary
    </button>

</form>

</body>

</html>
