
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Secure Bank{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-xl navbar-dark secure-navbar">
    <div class="container-fluid px-3 px-lg-4">

        <a class="navbar-brand fw-bold" href="{{ url_for('auth.dashboard') }}">
            <i class="bi bi-bank2 me-2"></i>Secure Bank
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#secureNavbar"
                aria-controls="secureNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="secureNavbar">

            <ul class="navbar-nav ms-auto align-items-xl-center">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.dashboard') }}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.withdraw') }}">
                        <i class="bi bi-cash-coin me-1"></i>Withdraw
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.balance') }}">
                        <i class="bi bi-wallet2 me-1"></i>Balance
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.transfer') }}">
                        <i class="bi bi-arrow-left-right me-1"></i>Transfer
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.deposit') }}">
                        <i class="bi bi-plus-circle me-1"></i>Deposit
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.history') }}">
                        <i class="bi bi-clock-history me-1"></i>History
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.notifications') }}">
                        <i class="bi bi-bell me-1"></i>Notifications
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.profile') }}">
                        <i class="bi bi-person-circle me-1"></i>Profile
                    </a>
                </li>

                <li class="nav-item ms-xl-2">
                    <a class="nav-link logout-link"
                       href="{{ url_for('auth.logout') }}">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<main class="container-fluid main-content px-3 px-lg-4">

    {% block content %}
    {% endblock %}

</main>

<footer class="secure-footer">
    <p class="mb-1">&copy; 2026 Secure Banking System</p>
    <p class="mb-0">Developed by Manoj SV</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
